<div class="login-container">

  <div class="login-card">

    <h1>Login</h1>

    <p>Entre para continuar</p>

    <input
      type="email"
      placeholder="E-mail"
    >

    <input
      type="password"
      placeholder="Senha"
    >

    <div class="area-botao">

      <button
        type="button"
        class="btn-login"
        (mouseenter)="fugir()"
        [style.transform]="'translate(' + posicaoX + 'px, ' + posicaoY + 'px)'"
      >
        Entrar
      </button>

    </div>

  </div>

</div>
